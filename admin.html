<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파란박스 설문 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #1a56b0; --blue-light: #e6f1fb;
    --green: #3B6D11; --green-bg: #eaf3de; --green-border: #639922;
    --amber-bg: #faeeda; --amber-text: #854F0B;
    --red-bg: #fcebeb; --red-text: #A32D2D; --red-border: #E24B4A;
    --border: #e2e2e2; --text: #1a1a1a; --text-muted: #666;
    --bg: #f5f6f8; --card: #fff; --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .login-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 380px; text-align: center; }
  .login-card h1 { font-size: 18px; margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
  .login-card input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; margin-bottom: 10px; outline: none; font-family: inherit; }
  .login-card input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,86,176,0.1); }
  .login-btn { width: 100%; padding: 11px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .login-btn:hover { background: #154698; }
  .login-err { color: var(--red-text); font-size: 13px; margin-top: 8px; display: none; }

  /* Admin layout */
  .admin { display: none; min-height: 100vh; }
  .topbar { background: var(--blue); color: #fff; padding: 0 1.5rem; height: 54px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .logout-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; font-family: inherit; }
  .logout-btn:hover { background: rgba(255,255,255,0.25); }

  .content { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .stat-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-card .value { font-size: 24px; font-weight: 600; color: var(--blue); }
  .stat-card .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
  .toolbar input { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13.5px; outline: none; font-family: inherit; flex: 1; min-width: 180px; }
  .toolbar input:focus { border-color: var(--blue); }
  .dl-btn { background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; white-space: nowrap; }
  .dl-btn:hover { background: #27500A; }
  .refresh-btn { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 14px; font-size: 13.5px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
  .refresh-btn:hover { border-color: var(--blue); color: var(--blue); }

  /* Table */
  .table-wrap { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wrap th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .table-wrap td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  .table-wrap tr:last-child td { border-bottom: none; }
  .table-wrap tr:hover td { background: #fafafa; }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
  .badge-high { background: var(--green-bg); color: var(--green); }
  .badge-mid  { background: var(--amber-bg); color: var(--amber-text); }
  .badge-low  { background: var(--red-bg); color: var(--red-text); }
  .badge-yes  { background: var(--blue-light); color: var(--blue); }
  .badge-no   { background: #f1f1f1; color: #555; }

  .photos-cell { display: flex; gap: 4px; flex-wrap: wrap; }
  .thumb { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }

  .detail-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-muted); }
  .detail-btn:hover { border-color: var(--blue); color: var(--blue); }

  .empty { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 14px; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .modal-header h2 { font-size: 16px; }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1; }
  .modal-row { display: flex; gap: 8px; margin-bottom: 10px; font-size: 13.5px; }
  .modal-row .lbl { width: 110px; flex-shrink: 0; color: var(--text-muted); font-weight: 500; }
  .modal-row .val { flex: 1; line-height: 1.6; }
  .modal-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
  .modal-photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div style="font-size:32px;margin-bottom:10px">🔒</div>
    <h1>파란박스 관리자</h1>
    <p>설문 응답 조회 및 엑셀 다운로드</p>
    <input type="email" id="loginEmail" placeholder="이메일" onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="loginPw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr">이메일 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- Admin -->
<div class="admin" id="adminWrap">
  <div class="topbar">
    <h1><i class="ti ti-box"></i> 파란박스 설문 관리자</h1>
    <div class="topbar-right">
      <span id="userEmail" style="font-size:13px;opacity:0.85"></span>
      <button class="logout-btn" onclick="doLogout()"><i class="ti ti-logout"></i> 로그아웃</button>
    </div>
  </div>

  <div class="content">
    <div class="stats" id="statsArea">
      <div class="stat-card"><div class="label">전체 응답</div><div class="value" id="statTotal">-</div></div>
      <div class="stat-card"><div class="label">펌프소음 상</div><div class="value" id="statPump">-</div><div class="sub">개선됨</div></div>
      <div class="stat-card"><div class="label">팬소음 상</div><div class="value" id="statFan">-</div><div class="sub">개선됨</div></div>
      <div class="stat-card"><div class="label">연소소음 상</div><div class="value" id="statComb">-</div><div class="sub">개선됨</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="대리점명, 이름, 모델명으로 검색..." oninput="renderTable()">
      <button class="refresh-btn" onclick="loadData()"><i class="ti ti-refresh" id="refreshIcon"></i> 새로고침</button>
      <button class="dl-btn" onclick="downloadExcel()"><i class="ti ti-file-spreadsheet"></i> 엑셀 다운로드</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>제출일시</th><th>대리점명</th><th>이름</th><th>모델명</th>
            <th>설치일자</th><th>설치장소</th><th>사전운전</th>
            <th>펌프</th><th>팬</th><th>연소</th><th>사진</th><th>상세</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none">데이터를 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">응답 상세</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  // ★ Firebase 콘솔에서 복사한 설정값으로 교체하세요 (index.html과 동일)
  const firebaseConfig = {
    apiKey:            "AIzaSyAcxGPyL-Tg-yB8pAwqqp8tCLOspTJzKIc",
    authDomain:        "bluebox-9471f.firebaseapp.com",
    projectId:         "bluebox-9471f",
    storageBucket:     "bluebox-9471f.firebasestorage.app",
    messagingSenderId: "764690233349",
    appId:             "1:764690233349:web:fc22418ed9c2f101a6c46c"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  window._fb = { db, auth, collection, getDocs, orderBy, query, signInWithEmailAndPassword, signOut, onAuthStateChanged };

  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('loginWrap').style.display  = 'none';
      document.getElementById('adminWrap').style.display  = 'block';
      document.getElementById('userEmail').textContent    = user.email;
      loadData();
    } else {
      document.getElementById('loginWrap').style.display  = 'flex';
      document.getElementById('adminWrap').style.display  = 'none';
    }
  });
</script>

<script>
  let allData = [];

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pw    = document.getElementById('loginPw').value;
    const { auth, signInWithEmailAndPassword } = window._fb;
    try {
      await signInWithEmailAndPassword(auth, email, pw);
    } catch (e) {
      document.getElementById('loginErr').style.display = 'block';
    }
  }
  window.doLogin = doLogin;

  async function doLogout() {
    const { auth, signOut } = window._fb;
    await signOut(auth);
  }
  window.doLogout = doLogout;

  async function loadData() {
    const icon = document.getElementById('refreshIcon');
    icon.classList.add('spinning');
    document.getElementById('emptyMsg').style.display = 'block';
    document.getElementById('emptyMsg').textContent = '데이터를 불러오는 중...';
    document.getElementById('tableBody').innerHTML = '';

    const { db, collection, getDocs, orderBy, query } = window._fb;
    try {
      const q    = query(collection(db, 'surveys'), orderBy('submittedAt', 'desc'));
      const snap = await getDocs(q);
      allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateStats();
      renderTable();
    } catch (e) {
      document.getElementById('emptyMsg').textContent = '불러오기 실패: ' + e.message;
    }
    icon.classList.remove('spinning');
  }
  window.loadData = loadData;

  function updateStats() {
    document.getElementById('statTotal').textContent = allData.length;
    document.getElementById('statPump').textContent  = allData.filter(r => r.pumpNoise === '상').length;
    document.getElementById('statFan').textContent   = allData.filter(r => r.fanNoise === '상').length;
    document.getElementById('statComb').textContent  = allData.filter(r => r.combustionNoise === '상').length;
  }

  function badge(val) {
    if (!val) return '-';
    if (val === '상') return `<span class="badge badge-high">상 😊</span>`;
    if (val === '중') return `<span class="badge badge-mid">중 😐</span>`;
    if (val === '하') return `<span class="badge badge-low">하 😔</span>`;
    if (val === '예') return `<span class="badge badge-yes">예</span>`;
    return `<span class="badge badge-no">${val}</span>`;
  }

  function fmtDate(ts) {
    if (!ts) return '-';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allData.filter(r =>
      !q || [r.agency, r.name, r.model, r.location].some(v => v && v.toLowerCase().includes(q))
    );

    const body = document.getElementById('tableBody');
    const empty = document.getElementById('emptyMsg');

    if (!filtered.length) {
      body.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = allData.length ? '검색 결과가 없습니다.' : '아직 응답이 없습니다.';
      return;
    }
    empty.style.display = 'none';

    body.innerHTML = filtered.map((r, i) => {
      const thumbs = (r.photos || []).slice(0, 3).map(p =>
        `<img class="thumb" src="${p.data}" alt="${p.name}" onclick="openImg(p, ${allData.indexOf(r)})" title="${p.name}">`
      ).join('') + (r.photos && r.photos.length > 3 ? `<span style="font-size:11px;color:var(--text-muted);align-self:center">+${r.photos.length - 3}</span>` : '');

      return `<tr>
        <td style="white-space:nowrap;font-size:12px">${fmtDate(r.submittedAt)}</td>
        <td><strong>${r.agency || '-'}</strong></td>
        <td>${r.name || '-'}</td>
        <td>${r.model || '-'}</td>
        <td style="white-space:nowrap">${r.installDate || '-'}</td>
        <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.location || ''}">${r.location || '-'}</td>
        <td>${badge(r.preRun)}</td>
        <td>${badge(r.pumpNoise)}</td>
        <td>${badge(r.fanNoise)}</td>
        <td>${badge(r.combustionNoise)}</td>
        <td><div class="photos-cell">${thumbs || '-'}</div></td>
        <td><button class="detail-btn" onclick="openDetail(${allData.indexOf(r)})">상세</button></td>
      </tr>`;
    }).join('');
  }
  window.renderTable = renderTable;

  function openDetail(idx) {
    const r = allData[idx];
    document.getElementById('modalTitle').textContent = r.agency + ' · ' + r.name;
    const photos = (r.photos || []).map(p => `<img src="${p.data}" alt="${p.name}" onclick="openImg(p, ${allData.indexOf(r)})">`).join('');
    document.getElementById('modalBody').innerHTML = `
      <div class="modal-row"><span class="lbl">제출일시</span><span class="val">${fmtDate(r.submittedAt)}</span></div>
      <div class="modal-row"><span class="lbl">대리점명</span><span class="val">${r.agency}</span></div>
      <div class="modal-row"><span class="lbl">담당자</span><span class="val">${r.name}</span></div>
      <div class="modal-row"><span class="lbl">모델명</span><span class="val">${r.model}</span></div>
      <div class="modal-row"><span class="lbl">설치일자</span><span class="val">${r.installDate}</span></div>
      <div class="modal-row"><span class="lbl">설치장소</span><span class="val">${r.location}</span></div>
      <div class="divider"></div>
      <div class="modal-row"><span class="lbl">사전 운전</span><span class="val">${badge(r.preRun)}</span></div>
      <div class="modal-row"><span class="lbl">펌프 소음</span><span class="val">${badge(r.pumpNoise)}</span></div>
      <div class="modal-row"><span class="lbl">팬 소음</span><span class="val">${badge(r.fanNoise)}</span></div>
      <div class="modal-row"><span class="lbl">연소 소음</span><span class="val">${badge(r.combustionNoise)}</span></div>
      <div class="modal-row"><span class="lbl">전반적 의견</span><span class="val">${r.overallComment || '-'}</span></div>
      ${photos ? `<div class="divider"></div><div style="font-size:13px;font-weight:500;margin-bottom:8px">첨부 사진 (${r.photos.length}장)</div><div class="modal-photos">${photos}</div>` : ''}
    `;
    document.getElementById('modalBg').classList.add('open');
  }
  window.openDetail = openDetail;

  function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
  window.closeModal = closeModal;

  function openImgData(dataUrl) { const w = window.open(); w.document.write('<img src="' + dataUrl + '" style="max-width:100%">'); }
  window.openImgData = openImgData;

  function downloadExcel() {
    if (!allData.length) { alert('다운로드할 데이터가 없습니다.'); return; }

    const rows = allData.map(r => ({
      '제출일시':     r.submittedAt ? (r.submittedAt.toDate ? r.submittedAt.toDate().toLocaleString('ko-KR') : r.submittedAt) : '',
      '대리점명':     r.agency || '',
      '담당자':       r.name || '',
      '모델명':       r.model || '',
      '설치일자':     r.installDate || '',
      '설치장소':     r.location || '',
      '사전운전여부': r.preRun || '',
      '펌프소음개선': r.pumpNoise || '',
      '팬소음개선':   r.fanNoise || '',
      '연소소음개선': r.combustionNoise || '',
      '전반적의견':   r.overallComment || '',
      '사진수':       r.photos ? r.photos.length : 0
    }));

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);

    // 컬럼 너비 설정
    ws['!cols'] = [
      {wch:20},{wch:16},{wch:10},{wch:12},{wch:12},{wch:24},
      {wch:12},{wch:12},{wch:10},{wch:12},{wch:40},{wch:6}
    ];

    XLSX.utils.book_append_sheet(wb, ws, '설치후기');

    const now = new Date();
    const stamp = now.toISOString().slice(0,10);
    XLSX.writeFile(wb, `파란박스_설치후기_${stamp}.xlsx`);
  }
  window.downloadExcel = downloadExcel;
</script>
</body>
</html>
