<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파란박스 설문 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #1a56b0; --blue-light: #e6f1fb;
    --green: #3B6D11; --green-bg: #eaf3de; --green-border: #639922;
    --amber-bg: #faeeda; --amber-text: #854F0B;
    --red-bg: #fcebeb; --red-text: #A32D2D; --red-border: #E24B4A;
    --border: #e2e2e2; --text: #1a1a1a; --text-muted: #666;
    --bg: #f5f6f8; --card: #fff; --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .login-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 360px; text-align: center; }
  .login-card h1 { font-size: 18px; margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
  .login-card input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; margin-bottom: 10px; outline: none; font-family: inherit; }
  .login-card input:focus { border-color: var(--blue); }
  .login-btn { width: 100%; padding: 11px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .login-btn:hover { background: #154698; }
  .login-err { color: var(--red-text); font-size: 13px; margin-top: 8px; display: none; }

  /* Admin */
  .admin { display: block; min-height: 100vh; }
  body:not(.logged-in) .auth-only { display: none !important; }
  body:not(.logged-in) #detailBody input,
  body:not(.logged-in) #detailBody select,
  body:not(.logged-in) #detailBody textarea { background:#f5f6f8; pointer-events:none; border-color:transparent; color:var(--text); }
  .topbar { background: var(--blue); color: #fff; padding: 0 1.5rem; height: 54px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; text-decoration: none; }
  .topbar-btn:hover { background: rgba(255,255,255,0.25); }

  .content { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .stat-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-card .value { font-size: 26px; font-weight: 600; color: var(--blue); }
  .noise-vals { display: flex; gap: 6px; margin-top: 8px; }
  .nv { display: flex; flex-direction: column; align-items: center; flex: 1; padding: 6px 4px; border-radius: 4px; }
  .nv.good { background: var(--green-bg); }
  .nv.mid  { background: var(--amber-bg); }
  .nv.bad  { background: var(--red-bg); }
  .nv-val  { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .nv-lbl  { font-size: 10px; margin-top: 2px; }
  .nv.good .nv-val, .nv.good .nv-lbl { color: var(--green); }
  .nv.mid  .nv-val, .nv.mid  .nv-lbl { color: var(--amber-text); }
  .nv.bad  .nv-val, .nv.bad  .nv-lbl { color: var(--red-text); }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
  .toolbar input { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13.5px; outline: none; font-family: inherit; flex: 1; min-width: 180px; }
  .toolbar input:focus { border-color: var(--blue); }
  .icon-btn { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13.5px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .icon-btn:hover { border-color: var(--blue); color: var(--blue); }
  .icon-btn.green { background: var(--green); color: #fff; border-color: var(--green); }
  .icon-btn.green:hover { background: #27500A; }

  /* Table */
  .table-wrap { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-size: 11.5px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
  .badge-high { background: var(--green-bg); color: var(--green); }
  .badge-mid  { background: var(--amber-bg); color: var(--amber-text); }
  .badge-low  { background: var(--red-bg); color: var(--red-text); }
  .badge-yes  { background: var(--blue-light); color: var(--blue); }
  .badge-no   { background: #f1f1f1; color: #555; }

  .media-cell { display: flex; gap: 4px; flex-wrap: wrap; }
  .thumb { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
  .video-thumb { width: 36px; height: 36px; border-radius: 4px; border: 1px solid var(--border); background: #111; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .video-thumb i { color: #fff; font-size: 14px; }

  .action-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 9px; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-muted); margin-right: 4px; }
  .action-btn:hover { border-color: var(--blue); color: var(--blue); }
  .action-btn.del:hover { border-color: var(--red-border); color: var(--red-text); }

  .empty { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 14px; }

  /* Modal base */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
  .modal.sm { max-width: 480px; }
  .modal.lg { max-width: 680px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .modal-header h2 { font-size: 16px; }
  .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); line-height: 1; padding: 2px 6px; }
  .modal-row { display: flex; gap: 8px; margin-bottom: 10px; font-size: 13.5px; }
  .modal-row .lbl { width: 110px; flex-shrink: 0; color: var(--text-muted); font-weight: 500; }
  .modal-row .val { flex: 1; line-height: 1.6; }
  .modal-row input, .modal-row select, .modal-row textarea { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13.5px; font-family: inherit; outline: none; }
  .modal-row input:focus, .modal-row select:focus, .modal-row textarea:focus { border-color: var(--blue); }
  .modal-row textarea { min-height: 70px; resize: vertical; }
  .modal-divider { height: 1px; background: var(--border); margin: 12px 0; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
  .modal-footer button { padding: 9px 18px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit; border: 1px solid var(--border); }
  .modal-footer .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .modal-footer .btn-primary:hover { background: #154698; }
  .modal-footer .btn-danger { background: var(--red-bg); color: var(--red-text); border-color: var(--red-border); }
  .modal-footer .btn-cancel { background: #fff; color: var(--text-muted); }

  /* 미디어 뷰어 */
  .media-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; align-items: center; justify-content: center; }
  .media-viewer.open { display: flex; }
  .media-viewer img { max-width: 92vw; max-height: 88vh; border-radius: 6px; object-fit: contain; }
  .media-viewer video { max-width: 92vw; max-height: 88vh; border-radius: 6px; outline: none; }
  .viewer-close { position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 22px; cursor: pointer; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }

  /* 미디어 그리드 (상세 모달) */
  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 8px; }
  .media-grid-item { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); aspect-ratio: 1; cursor: pointer; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
  .media-grid-item img { width: 100%; height: 100%; object-fit: cover; }
  .media-grid-item video { width: 100%; height: 100%; object-fit: cover; }
  .media-grid-item .play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); }
  .media-grid-item .play-icon i { color: #fff; font-size: 28px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body>

<!-- 로그인 모달 -->
<div class="modal-bg" id="loginModal" onclick="if(event.target===this)closeModal('loginModal')">
  <div class="modal sm">
    <div class="modal-header">
      <h2>관리자 로그인</h2>
      <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    </div>
    <div style="padding:4px 0 8px">
      <input type="email" id="loginEmail" placeholder="이메일" style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;display:block" onkeydown="if(event.key==='Enter')doLogin()">
      <input type="password" id="loginPw" placeholder="비밀번호" style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;display:block" onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()" style="width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">로그인</button>
      <div id="loginErr" style="color:var(--red-text);font-size:13px;margin-top:8px;display:none">이메일 또는 비밀번호가 올바르지 않습니다.</div>
    </div>
  </div>
</div>

<!-- Admin -->
<div class="admin" id="adminWrap">
  <div class="topbar">
    <h1><i class="ti ti-box"></i> 파란박스 설문 관리자</h1>
    <div class="topbar-right">
      <a class="topbar-btn" href="index.html"><i class="ti ti-forms"></i> 설문지</a>
      <div id="guestArea">
        <button class="topbar-btn" onclick="openLoginModal()"><i class="ti ti-lock"></i> 관리자 로그인</button>
      </div>
      <div id="loggedArea" style="display:none;align-items:center;gap:10px">
        <span id="userEmail" style="font-size:13px;opacity:0.85"></span>
        <button class="topbar-btn" onclick="doLogout()"><i class="ti ti-logout"></i> 로그아웃</button>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="stats" id="statsArea">
      <div class="stat-card"><div class="label">전체 응답</div><div class="value" id="statTotal">-</div></div>
      <div class="stat-card">
        <div class="label">펌프소음</div>
        <div class="noise-vals">
          <div class="nv good"><span class="nv-val" id="statPumpGood">-</span><span class="nv-lbl">좋음</span></div>
          <div class="nv mid"><span class="nv-val" id="statPumpMid">-</span><span class="nv-lbl">보통</span></div>
          <div class="nv bad"><span class="nv-val" id="statPumpBad">-</span><span class="nv-lbl">나쁨</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="label">팬소음</div>
        <div class="noise-vals">
          <div class="nv good"><span class="nv-val" id="statFanGood">-</span><span class="nv-lbl">좋음</span></div>
          <div class="nv mid"><span class="nv-val" id="statFanMid">-</span><span class="nv-lbl">보통</span></div>
          <div class="nv bad"><span class="nv-val" id="statFanBad">-</span><span class="nv-lbl">나쁨</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="label">연소소음</div>
        <div class="noise-vals">
          <div class="nv good"><span class="nv-val" id="statCombGood">-</span><span class="nv-lbl">좋음</span></div>
          <div class="nv mid"><span class="nv-val" id="statCombMid">-</span><span class="nv-lbl">보통</span></div>
          <div class="nv bad"><span class="nv-val" id="statCombBad">-</span><span class="nv-lbl">나쁨</span></div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="대리점명, 이름, 모델명으로 검색..." oninput="renderTable()">
      <button class="icon-btn" onclick="loadData()"><i class="ti ti-refresh" id="refreshIcon"></i> 새로고침</button>
      <button class="icon-btn green" onclick="downloadExcel()"><i class="ti ti-file-spreadsheet"></i> 엑셀 다운로드</button>
      <button class="icon-btn auth-only" onclick="document.getElementById('xlsxUploadInput').click()"><i class="ti ti-upload"></i> 엑셀 업로드</button>
      <input type="file" id="xlsxUploadInput" accept=".xlsx,.xls" style="display:none" onchange="parseExcelUpload(this)">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>제출일시</th><th>대리점명</th><th>이름</th><th>모델명</th>
            <th>설치일자</th><th>설치장소</th><th>사전운전</th>
            <th>펌프</th><th>팬</th><th>연소</th><th>미디어</th><th>관리</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg">데이터를 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 상세/수정 모달 -->
<div class="modal-bg" id="detailModal" onclick="if(event.target===this)closeModal('detailModal')">
  <div class="modal lg">
    <div class="modal-header">
      <h2 id="detailTitle">응답 상세</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div id="detailBody"></div>
    <div class="modal-footer">
      <button class="modal-footer btn-cancel" onclick="closeModal('detailModal')">닫기</button>
      <button class="modal-footer btn-primary auth-only" onclick="saveEdit()"><i class="ti ti-device-floppy"></i> 저장</button>
    </div>
  </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal-bg" id="deleteModal" onclick="if(event.target===this)closeModal('deleteModal')">
  <div class="modal sm">
    <div class="modal-header">
      <h2>응답 삭제</h2>
      <button class="modal-close" onclick="closeModal('deleteModal')">✕</button>
    </div>
    <p style="font-size:14px;color:var(--text-muted);line-height:1.6">이 응답을 삭제하면 복구할 수 없습니다.<br>정말 삭제하시겠습니까?</p>
    <div class="modal-footer">
      <button class="modal-footer btn-cancel" onclick="closeModal('deleteModal')">취소</button>
      <button class="modal-footer btn-danger" onclick="confirmDelete()"><i class="ti ti-trash"></i> 삭제</button>
    </div>
  </div>
</div>

<!-- 엑셀 업로드 모달 -->
<div class="modal-bg" id="uploadModal" onclick="if(event.target===this)closeModal('uploadModal')">
  <div class="modal lg">
    <div class="modal-header">
      <h2><i class="ti ti-upload" style="font-size:16px"></i> 엑셀 업로드</h2>
      <button class="modal-close" onclick="closeModal('uploadModal')">✕</button>
    </div>
    <div id="uploadPreview"></div>
    <div class="modal-footer">
      <button class="modal-footer btn-cancel" onclick="closeModal('uploadModal')">취소</button>
      <button class="modal-footer btn-primary" id="uploadConfirmBtn" onclick="confirmUpload()"><i class="ti ti-upload"></i> 등록</button>
    </div>
  </div>
</div>

<!-- 미디어 뷰어 -->
<div class="media-viewer" id="mediaViewer" onclick="if(event.target===this)closeViewer()">
  <button class="viewer-close" onclick="closeViewer()">✕</button>
  <div id="viewerContent"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, orderBy, query, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey:            "AIzaSyAcxGPyL-Tg-yB8pAwqqp8tCLOspTJzKIc",
    authDomain:        "bluebox-9471f.firebaseapp.com",
    projectId:         "bluebox-9471f",
    storageBucket:     "bluebox-9471f.firebasestorage.app",
    messagingSenderId: "764690233349",
    appId:             "1:764690233349:web:fc22418ed9c2f101a6c46c"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  window._fb = { db, auth, collection, getDocs, doc, updateDoc, deleteDoc, orderBy, query, addDoc, serverTimestamp, signInWithEmailAndPassword, signOut, onAuthStateChanged };

  let _dataLoaded = false;
  onAuthStateChanged(auth, user => {
    document.body.classList.toggle('logged-in', !!user);
    if (user) {
      document.getElementById('guestArea').style.display  = 'none';
      document.getElementById('loggedArea').style.display = 'flex';
      document.getElementById('userEmail').textContent    = user.email;
      closeModal('loginModal');
    } else {
      document.getElementById('guestArea').style.display  = '';
      document.getElementById('loggedArea').style.display = 'none';
    }
    if (!_dataLoaded) { _dataLoaded = true; loadData(); }
  });
</script>

<script>
  let allData = [];
  let editingId = null;
  let deletingId = null;

  function openLoginModal() {
    document.getElementById('loginErr').style.display = 'none';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPw').value = '';
    document.getElementById('loginModal').classList.add('open');
  }
  window.openLoginModal = openLoginModal;

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pw    = document.getElementById('loginPw').value;
    document.getElementById('loginErr').style.display = 'none';
    try { await window._fb.signInWithEmailAndPassword(window._fb.auth, email, pw); }
    catch (e) { document.getElementById('loginErr').style.display = 'block'; }
  }
  window.doLogin = doLogin;

  async function doLogout() { await window._fb.signOut(window._fb.auth); }
  window.doLogout = doLogout;

  async function loadData() {
    const icon = document.getElementById('refreshIcon');
    icon.classList.add('spinning');
    document.getElementById('emptyMsg').style.display = 'block';
    document.getElementById('emptyMsg').textContent = '데이터를 불러오는 중...';
    document.getElementById('tableBody').innerHTML = '';
    const { db, collection, getDocs, orderBy, query } = window._fb;
    try {
      const q    = query(collection(db, 'surveys'), orderBy('submittedAt', 'desc'));
      const snap = await getDocs(q);
      allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateStats(); renderTable();
    } catch (e) { document.getElementById('emptyMsg').textContent = '불러오기 실패: ' + e.message; }
    icon.classList.remove('spinning');
  }
  window.loadData = loadData;

  function updateStats() {
    document.getElementById('statTotal').textContent = allData.length;
    [['Pump','pumpNoise'],['Fan','fanNoise'],['Comb','combustionNoise']].forEach(([k, f]) => {
      document.getElementById('stat'+k+'Good').textContent = allData.filter(r => r[f] === '좋음').length;
      document.getElementById('stat'+k+'Mid').textContent  = allData.filter(r => r[f] === '보통').length;
      document.getElementById('stat'+k+'Bad').textContent  = allData.filter(r => r[f] === '나쁨').length;
    });
  }

  function badge(val) {
    if (!val) return '-';
    if (val === '좋음') return `<span class="badge badge-high">좋음 😊</span>`;
    if (val === '보통') return `<span class="badge badge-mid">보통 😐</span>`;
    if (val === '나쁨') return `<span class="badge badge-low">나쁨 😔</span>`;
    if (val === '예') return `<span class="badge badge-yes">예</span>`;
    return `<span class="badge badge-no">${val}</span>`;
  }

  function fmtDate(ts) {
    if (!ts) return '-';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allData.filter(r =>
      !q || [r.agency, r.name, r.model, r.location].some(v => v && v.toLowerCase().includes(q))
    );
    const body = document.getElementById('tableBody');
    const empty = document.getElementById('emptyMsg');
    if (!filtered.length) { body.innerHTML = ''; empty.style.display = 'block'; empty.textContent = allData.length ? '검색 결과가 없습니다.' : '아직 응답이 없습니다.'; return; }
    empty.style.display = 'none';

    body.innerHTML = filtered.map(r => {
      const media = r.media || (r.photos ? r.photos.map(p => ({kind:'photo',name:p.name,data:p.data})) : []);
      const thumbs = media.slice(0, 4).map((m, mi) => {
        const idx = allData.indexOf(r);
        if (m.kind === 'video') return `<div class="video-thumb" onclick="event.stopPropagation();openViewer(${idx},${allData.indexOf(r) !== -1 ? media.indexOf(m) : mi})" title="${m.name}"><i class="ti ti-player-play"></i></div>`;
        return `<img class="thumb" src="${m.url || m.data}" onclick="event.stopPropagation();openViewer(${idx},${media.indexOf(m)})" title="${m.name}">`;
      }).join('');
      const idx = allData.indexOf(r);
      return `<tr onclick="openDetail(${idx})" style="cursor:pointer">
        <td style="white-space:nowrap;font-size:12px">${fmtDate(r.submittedAt)}</td>
        <td><strong>${r.agency||'-'}</strong></td>
        <td>${r.name||'-'}</td>
        <td>${r.model||'-'}</td>
        <td style="white-space:nowrap">${r.installDate||'-'}</td>
        <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.location||''}">${r.location||'-'}</td>
        <td>${badge(r.preRun)}</td>
        <td>${badge(r.pumpNoise)}</td>
        <td>${badge(r.fanNoise)}</td>
        <td>${badge(r.combustionNoise)}</td>
        <td><div class="media-cell">${thumbs||'-'}</div></td>
        <td style="white-space:nowrap" onclick="event.stopPropagation()">
          <button class="action-btn auth-only" onclick="openDetail(${idx})"><i class="ti ti-edit"></i> 수정</button>
          <button class="action-btn del auth-only" onclick="openDelete(${idx})"><i class="ti ti-trash"></i></button>
        </td>
      </tr>`;
    }).join('');
  }
  window.renderTable = renderTable;

  // 상세/수정 모달
  function openDetail(idx) {
    const r = allData[idx];
    editingId = r.id;
    document.getElementById('detailTitle').textContent = r.agency + ' · ' + r.name;
    const media = r.media || (r.photos ? r.photos.map(p => ({kind:'photo',name:p.name,data:p.data})) : []);
    const mediaHtml = media.map((m, mi) => {
      if (m.kind === 'video') return `<div class="media-grid-item" onclick="openViewer(${idx},${mi})"><video src="${m.url || m.data}"></video><div class="play-icon"><i class="ti ti-player-play"></i></div></div>`;
      return `<div class="media-grid-item" onclick="openViewer(${idx},${mi})"><img src="${m.url || m.data}" alt="${m.name}"></div>`;
    }).join('');

    const selOpt = (v, cur) => ['좋음','보통','나쁨'].map(o => `<option value="${o}" ${o===cur?'selected':''}>${o}</option>`).join('');
    const ynOpt  = (v, cur) => ['예','아니오'].map(o => `<option value="${o}" ${o===cur?'selected':''}>${o}</option>`).join('');

    document.getElementById('detailBody').innerHTML = `
      <div class="modal-row"><span class="lbl">제출일시</span><span class="val">${fmtDate(r.submittedAt)}</span></div>
      <div class="modal-row"><span class="lbl">대리점명</span><input id="e-agency" value="${r.agency||''}"></div>
      <div class="modal-row"><span class="lbl">담당자</span><input id="e-name" value="${r.name||''}"></div>
      <div class="modal-row"><span class="lbl">모델명</span><input id="e-model" value="${r.model||''}"></div>
      <div class="modal-row"><span class="lbl">설치일자</span><input type="date" id="e-date" value="${r.installDate||''}"></div>
      <div class="modal-row"><span class="lbl">설치장소</span><input id="e-location" value="${r.location||''}"></div>
      <div class="modal-divider"></div>
      <div class="modal-row"><span class="lbl">사전 운전</span><select id="e-prerun">${ynOpt('',r.preRun)}</select></div>
      <div class="modal-row"><span class="lbl">펌프 소음</span><select id="e-pump">${selOpt('',r.pumpNoise)}</select></div>
      <div class="modal-row"><span class="lbl">팬 소음</span><select id="e-fan">${selOpt('',r.fanNoise)}</select></div>
      <div class="modal-row"><span class="lbl">연소 소음</span><select id="e-comb">${selOpt('',r.combustionNoise)}</select></div>
      <div class="modal-row"><span class="lbl">전반적 의견</span><textarea id="e-comment">${r.overallComment||''}</textarea></div>
      ${mediaHtml ? `<div class="modal-divider"></div><div style="font-size:13px;font-weight:500;margin-bottom:8px">첨부 미디어 (${media.length}개)</div><div class="media-grid">${mediaHtml}</div>` : ''}
    `;
    document.getElementById('detailModal').classList.add('open');
  }
  window.openDetail = openDetail;

  async function saveEdit() {
    if (!editingId) return;
    const { db, doc, updateDoc } = window._fb;
    const updates = {
      agency:          document.getElementById('e-agency').value.trim(),
      name:            document.getElementById('e-name').value.trim(),
      model:           document.getElementById('e-model').value.trim(),
      installDate:     document.getElementById('e-date').value,
      location:        document.getElementById('e-location').value.trim(),
      preRun:          document.getElementById('e-prerun').value,
      pumpNoise:       document.getElementById('e-pump').value,
      fanNoise:        document.getElementById('e-fan').value,
      combustionNoise: document.getElementById('e-comb').value,
      overallComment:  document.getElementById('e-comment').value.trim(),
    };
    try {
      await updateDoc(doc(db, 'surveys', editingId), updates);
      closeModal('detailModal');
      await loadData();
    } catch (e) { alert('저장 실패: ' + e.message); }
  }
  window.saveEdit = saveEdit;

  // 삭제
  function openDelete(idx) {
    deletingId = allData[idx].id;
    document.getElementById('deleteModal').classList.add('open');
  }
  window.openDelete = openDelete;

  async function confirmDelete() {
    if (!deletingId) return;
    const { db, doc, deleteDoc } = window._fb;
    try {
      await deleteDoc(doc(db, 'surveys', deletingId));
      closeModal('deleteModal');
      await loadData();
    } catch (e) {
      console.error('삭제 오류:', e.code, e.message);
      if (e.code === 'permission-denied' || (e.message && e.message.includes('permission'))) {
        alert('삭제 실패: Firebase 보안 규칙에서 삭제 권한이 없습니다.\n\nFirebase 콘솔 > Firestore Database > 규칙 탭에서\nallow delete 권한을 추가해 주세요.');
      } else {
        alert('삭제 실패: ' + e.message);
      }
    }
  }
  window.confirmDelete = confirmDelete;

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  window.closeModal = closeModal;

  // 미디어 뷰어
  function openViewer(rowIdx, mediaIdx) {
    const r = allData[rowIdx];
    if (!r) return;
    const media = r.media || (r.photos ? r.photos.map(p => ({kind:'photo',name:p.name,data:p.data})) : []);
    const m = media[mediaIdx];
    if (!m) return;
    const vc = document.getElementById('viewerContent');
    vc.innerHTML = '';

    if (m.kind === 'video') {
      const src = m.url || m.data;
      if (!src) {
        vc.innerHTML = '<div style="color:#fff;padding:30px;text-align:center;font-size:15px">동영상 URL이 없습니다.</div>';
      } else {
        vc.innerHTML = `
          <div style="text-align:center">
            <video controls playsinline style="max-width:92vw;max-height:75vh;width:min(640px,92vw);border-radius:6px;outline:none;display:block;margin:0 auto;background:#000">
              <source src="${src}"${m.mime ? ` type="${m.mime}"` : ''}>
              동영상을 재생할 수 없습니다.
            </video>
            <a href="${src}" target="_blank" rel="noopener" style="color:#93c5fd;font-size:13px;margin-top:12px;display:inline-block;text-decoration:none">새 탭에서 열기 ↗</a>
            <div style="color:#aaa;font-size:12px;margin-top:6px">${m.name || ''}</div>
          </div>`;
        const video = vc.querySelector('video');
        if (video) video.play().catch(() => {});
      }
    } else {
      const data = m.url || m.data;
      if (!data) {
        vc.innerHTML = '<div style="color:#fff;padding:30px;text-align:center;font-size:15px">이미지 데이터가 없습니다.<br><small style="color:#aaa;font-size:12px">kind: ' + (m.kind||'?') + ' / name: ' + (m.name||'?') + '</small></div>';
      } else {
        vc.innerHTML = `
          <div style="text-align:center">
            <img src="${data}" style="max-width:92vw;max-height:82vh;border-radius:6px;object-fit:contain;display:block;margin:0 auto"
              onerror="this.outerHTML='<div style=\\'color:#fff;padding:30px;text-align:center;font-size:15px\\'>이미지를 불러올 수 없습니다.<br><small style=\\'color:#aaa;font-size:12px\\'>${(m.name||'').replace(/'/g,"\\'")}</small></div>'">
            <div style="color:#aaa;font-size:12px;margin-top:8px">${m.name || ''}</div>
          </div>`;
      }
    }
    document.getElementById('mediaViewer').classList.add('open');
  }
  window.openViewer = openViewer;

  function closeViewer() {
    const vc = document.getElementById('viewerContent');
    const video = vc.querySelector('video');
    if (video) { try { video.pause(); } catch(e){} video.src = ''; }
    document.getElementById('mediaViewer').classList.remove('open');
    vc.innerHTML = '';
  }
  window.closeViewer = closeViewer;

  // 엑셀 업로드
  let uploadRows = [];

  function parseExcelUpload(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';
    const reader = new FileReader();
    reader.onload = function(e) {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      if (!rows.length) { alert('데이터가 없습니다. 올바른 엑셀 파일을 선택해 주세요.'); return; }

      uploadRows = rows.map(r => ({
        agency:          String(r['대리점'] || r['대리점명'] || ''),
        name:            String(r['설치자'] || r['담당자'] || ''),
        model:           String(r['모델명'] || ''),
        installDate:     r['설치일자'] != null ? String(r['설치일자']) : '',
        location:        String(r['설치장소'] || ''),
        preRun:          String(r['사전운전여부'] || ''),
        pumpNoise:       String(r['펌프소음개선'] || r['펌프소음'] || ''),
        fanNoise:        String(r['팬소음개선'] || r['팬소음'] || ''),
        combustionNoise: String(r['연소소음개선'] || r['연소소음'] || ''),
        overallComment:  String(r['전반적의견'] || r['의견'] || ''),
        media:           []
      }));

      document.getElementById('uploadPreview').innerHTML = `
        <p style="font-size:13.5px;margin-bottom:12px;color:var(--text-muted)">
          <strong style="color:var(--text)">${uploadRows.length}개</strong> 행을 Firestore에 등록합니다.
        </p>
        <div style="overflow:auto;max-height:360px">
          <table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:580px">
            <thead>
              <tr style="background:#f8f9fa;position:sticky;top:0">
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">#</th>
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">대리점명</th>
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">담당자</th>
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">모델명</th>
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">설치일자</th>
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">펌프</th>
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">팬</th>
                <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">연소</th>
              </tr>
            </thead>
            <tbody>
              ${uploadRows.map((r, i) => `<tr>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border);color:var(--text-muted)">${i+1}</td>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border)"><strong>${r.agency||'-'}</strong></td>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border)">${r.name||'-'}</td>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border)">${r.model||'-'}</td>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border);white-space:nowrap">${r.installDate||'-'}</td>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border)">${r.pumpNoise||'-'}</td>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border)">${r.fanNoise||'-'}</td>
                <td style="padding:6px 10px;border-bottom:0.5px solid var(--border)">${r.combustionNoise||'-'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      document.getElementById('uploadModal').classList.add('open');
    };
    reader.readAsArrayBuffer(file);
  }
  window.parseExcelUpload = parseExcelUpload;

  async function confirmUpload() {
    if (!uploadRows.length) return;
    const total = uploadRows.length;
    const btn = document.getElementById('uploadConfirmBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2 spinning"></i> 등록 중...';
    const { db, collection, addDoc, serverTimestamp } = window._fb;
    try {
      for (const row of uploadRows) {
        await addDoc(collection(db, 'surveys'), { ...row, submittedAt: serverTimestamp() });
      }
      closeModal('uploadModal');
      uploadRows = [];
      await loadData();
      alert(`${total}개 데이터가 등록되었습니다.`);
    } catch (e) {
      alert('등록 실패: ' + e.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-upload"></i> 등록';
    }
  }
  window.confirmUpload = confirmUpload;

  // 엑셀 + 사진 ZIP 다운로드
  async function downloadExcel() {
    if (!allData.length) { alert('다운로드할 데이터가 없습니다.'); return; }

    const zip = new JSZip();
    const photoFolder = zip.folder('사진');

    const rows = allData.map((r, ri) => {
      const media  = r.media || (r.photos ? r.photos.map(p => ({kind:'photo', name:p.name, data:p.data})) : []);
      const photos = media.filter(m => m.kind === 'photo');
      const videos = media.filter(m => m.kind === 'video');

      // 사진을 ZIP 폴더에 추가
      photos.forEach(m => {
        if (m.data && m.data.includes(',')) {
          const b64 = m.data.split(',')[1];
          const safe = (r.agency || 'unknown').replace(/[\/\\:*?"<>|]/g, '_');
          photoFolder.file(`${String(ri + 1).padStart(3,'0')}_${safe}_${m.name}`, b64, { base64: true });
        }
      });

      return {
        '제출일자':        r.submittedAt ? (r.submittedAt.toDate ? r.submittedAt.toDate().toLocaleString('ko-KR') : r.submittedAt) : '',
        '대리점':          r.agency || '',
        '설치자':          r.name || '',
        '모델명':          r.model || '',
        '설치일자':        r.installDate || '',
        '설치장소':        r.location || '',
        '사전운전여부':    r.preRun || '',
        '펌프소음개선':    r.pumpNoise || '',
        '팬소음개선':      r.fanNoise || '',
        '연소소음개선':    r.combustionNoise || '',
        '전반적의견':      r.overallComment || '',
        '사진수':          photos.length,
        '첨부사진파일명':  photos.map(m => m.name).join(', '),
        '동영상수':        videos.length,
        '첨부동영상파일명': videos.map(m => m.name).join(', ')
      };
    });

    // 엑셀 생성 후 ZIP에 포함
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
      {wch:20},{wch:16},{wch:10},{wch:12},{wch:12},{wch:24},
      {wch:12},{wch:12},{wch:10},{wch:12},{wch:40},{wch:6},{wch:30},{wch:8},{wch:30}
    ];
    XLSX.utils.book_append_sheet(wb, ws, '설치후기');
    const dateStr = new Date().toISOString().slice(0, 10);
    zip.file(`파란박스_설치후기_${dateStr}.xlsx`, XLSX.write(wb, { type: 'base64', bookType: 'xlsx' }), { base64: true });

    const blob = await zip.generateAsync({ type: 'blob' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `파란박스_설치후기_${dateStr}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  window.downloadExcel = downloadExcel;
</script>
</body>
</html>
